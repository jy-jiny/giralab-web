name: Deploy GiraLab Web
on:
  pull_request:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/test-hearts-release.mjs', 'scripts/hearts-fixture.json', 'scripts/verify-release.py', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete bundle, approved art and audio hashes
        run: python3 scripts/verify-release.py
      - name: Check compiled JavaScript
        run: for f in site/assets/*.js; do node --check "$f"; done
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/giralab-browser-tools" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/giralab-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify hearts, paid replay and compact results without production API access
        env:
          GIRALAB_BROWSER_TOOLS: ${{ runner.temp }}/giralab-browser-tools
        run: node scripts/test-hearts-release.mjs
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify every published byte against the tested build
        run: python3 scripts/verify-release.py https://jy-jiny.github.io/giralab-web/
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/giralab-browser-tools" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/giralab-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify the actual live result layout with isolated API fixtures
        env:
          GIRALAB_BROWSER_TOOLS: ${{ runner.temp }}/giralab-browser-tools
        run: node scripts/test-hearts-release.mjs https://jy-jiny.github.io/giralab-web/


