name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built web bundle
        run: |
          curl -fL 'https://sdmntprwestus.oaiusercontent.com/files/00000000-65c0-8230-992d-e7706bad4396/raw?se=2026-09-18T02%3A38%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=395f47fb-cc41-5652-b2fb-aa0a95a054b0&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A01%3A12Z&ske=2026-09-19T02%3A01%3A12Z&sks=b&skv=2026-02-06&sig=6oYmWvk1mY5hCL/XPH6WrXp46rT3kqxjIEaCopAIhoY%3D' -o giralab-web-dist.zip
          mkdir -p site
          unzip -q giralab-web-dist.zip -d site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
