name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download last good Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35309357442

      - name: Unpack previous live site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          tar -xf previous-pages/artifact.tar -C site
          touch site/.nojekyll

      - name: Fix loading screen and use real progress
        shell: bash
        run: |
          set -euo pipefail

          cat > site/loading-fix.css <<'CSS'
          .boot-screen.giralab-loading-screen{opacity:0!important;pointer-events:none!important}
          .giralab-live-loading{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#000b1b;color:#fff;display:block}
          .giralab-live-loading .visual{position:absolute;inset:0 0 20% 0;overflow:hidden;background:#00142b}
          .giralab-live-loading .visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;image-rendering:auto}
          .giralab-live-loading .fade{position:absolute;left:0;right:0;bottom:0;height:31%;background:linear-gradient(180deg,rgba(0,11,27,0) 0%,#000b1b 52%,#000b1b 100%);pointer-events:none}
          .giralab-live-loading .progress-area{position:absolute;left:50%;bottom:max(6.5dvh,34px);transform:translateX(-50%);width:min(74vw,390px);text-align:center}
          .giralab-live-loading .track{height:16px;padding:2px;border:2px solid #117dff;border-radius:999px;background:#06142b;box-shadow:0 0 14px rgba(0,139,255,.7),inset 0 0 8px rgba(0,0,0,.7);overflow:hidden}
          .giralab-live-loading .fill{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#1eeaff 0%,#17c6ff 60%,#52f7ff 100%);box-shadow:0 0 14px rgba(24,228,255,.95);transition:width .25s ease}
          .giralab-live-loading .label{margin:17px 0 0;color:#b9d9ff;font-size:clamp(14px,4vw,18px);font-weight:800;letter-spacing:.2px;text-shadow:0 0 10px rgba(49,155,255,.65)}
          @media(max-height:700px){.giralab-live-loading .visual{inset:0 0 22% 0}.giralab-live-loading .progress-area{bottom:max(4dvh,24px)}}
          CSS

          cat > site/loading-fix.js <<'JS'
          (() => {
            let overlay = null;
            let fill = null;
            let label = null;
            const assetUrl = new URL('./giralab-loading-screen.webp', document.baseURI).href;

            function removeOverlay() {
              if (overlay) overlay.remove();
              overlay = fill = label = null;
            }

            function createOverlay() {
              if (overlay) return;
              overlay = document.createElement('div');
              overlay.className = 'giralab-live-loading';
              overlay.setAttribute('aria-hidden', 'true');
              overlay.innerHTML = '<div class="visual"><img alt="" draggable="false"><div class="fade"></div></div><div class="progress-area"><div class="track"><span class="fill"></span></div><p class="label">로딩 중...</p></div>';
              overlay.querySelector('img').src = assetUrl;
              fill = overlay.querySelector('.fill');
              label = overlay.querySelector('.label');
              document.body.appendChild(overlay);
            }

            function sync() {
              const boot = document.querySelector('.boot-screen.giralab-loading-screen');
              if (!boot) {
                removeOverlay();
                return;
              }
              createOverlay();
              const status = boot.querySelector('.boot-loading-status');
              const match = status?.textContent?.match(/(\d{1,3})\s*%/);
              const value = Math.max(0, Math.min(100, Number(match?.[1] ?? 0)));
              if (fill) fill.style.width = value + '%';
              if (label) label.textContent = value >= 100 ? '준비 완료' : '로딩 중...';
            }

            new MutationObserver(sync).observe(document.documentElement, {subtree:true, childList:true, characterData:true});
            window.addEventListener('pageshow', sync);
            sync();
          })();
          JS

          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text()
          s=s.replace('</head>','<link rel="stylesheet" href="./loading-fix.css"></head>')
          s=s.replace('</body>','<script src="./loading-fix.js"></script></body>')
          p.write_text(s)
          PY

      - name: Configure Pages

        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
