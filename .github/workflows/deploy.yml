name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'site/**'
      - 'scripts/verify-live-loading.py'
      - 'deploy-assets/approved-web-import.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import the tested source build once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, urllib.request, zipfile
          from pathlib import Path
          spec = Path('deploy-assets/approved-web-import.json')
          if spec.exists():
              data = json.loads(spec.read_text())
              with urllib.request.urlopen(data['url'], timeout=90) as response:
                  bundle = response.read()
              assert hashlib.sha256(bundle).hexdigest() == data['sha256'], 'Bundle checksum mismatch'
              destination = Path('site').resolve()
              destination.mkdir(exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
                  for name in archive.namelist():
                      assert (destination / name).resolve().is_relative_to(destination), 'Unsafe archive path'
                  archive.extractall(destination)
              (destination / 'loading-build.json').write_text(json.dumps({'sourceRun': data['sourceRun'], 'bundleSHA256': data['sha256'], 'artworkSHA256': 'd52df73017d84d2ea77e0f50fae2726b84cdc7cb69376efb96231d124a32d109', 'dimensions': [864, 1536]}, indent=2))
          assert Path('site/index.html').is_file(), 'No validated site snapshot'
          art = Path('site/giralab-loading-d52df73017d8.jpg').read_bytes()
          assert hashlib.sha256(art).hexdigest() == 'd52df73017d84d2ea77e0f50fae2726b84cdc7cb69376efb96231d124a32d109'
          assert 'giralab-loading-d52df73017d8.jpg' in Path('site/index.html').read_text()
          Path('site/.nojekyll').touch()
          PY
          for file in site/assets/*.js; do node --check "$file"; done

      - name: Keep a durable deployable site snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          git rm --ignore-unmatch deploy-assets/approved-web-import.json
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: persist tested loading screen and original artwork [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live website and capture proof
        run: |
          python3 -m pip install playwright==1.56.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 scripts/verify-live-loading.py

      - name: Upload live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giralab-live-loading-proof
          path: live-loading-proof
          retention-days: 7
