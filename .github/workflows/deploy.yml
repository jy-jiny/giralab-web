name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download last good Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35309357442

      - name: Unpack previous live site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          tar -xf previous-pages/artifact.tar -C site
          touch site/.nojekyll

      - name: Build crisp loading screen with real progress
        shell: bash
        run: |
          set -euo pipefail

          # Rebuild the approved high-resolution loading artwork without the baked-in fake bar.
          cat \
            deploy-assets/loading.b64.part00 \
            deploy-assets/loading.b64.part01 \
            deploy-assets/loading.b64.part02 \
            deploy-assets/loading.b64.part03 \
            deploy-assets/loading.b64.part04a \
            deploy-assets/loading.b64.part04b \
            deploy-assets/loading.b64.part05 \
            deploy-assets/loading.b64.part06 \
            deploy-assets/loading.b64.part07 \
            deploy-assets/loading.b64.part08 \
            > /tmp/giralab-loading.b64
          base64 -d /tmp/giralab-loading.b64 > site/giralab-loading-art.webp

          python3 - <<'PY'
          from pathlib import Path
          image = Path("site/giralab-loading-art.webp").read_bytes()
          if len(image) != 61288 or image[:4] != b"RIFF" or image[8:12] != b"WEBP":
              raise SystemExit("loading artwork reconstruction failed")

          js_file = next(Path("site/assets").glob("*.js"))
          js = js_file.read_text()
          old = '(0,F.jsxs)(`main`,{className:`boot-screen giralab-loading-screen`,"aria-label":`GiraLab 로딩 중`,children:[(0,F.jsx)(`img`,{className:`boot-full-image`,src:mc(`giralab-loading-screen.webp`),alt:``,fetchPriority:`high`,draggable:!1}),(0,F.jsxs)(`span`,{className:`boot-loading-status`,"aria-live":`polite`,children:[`게임 준비 `,_e,`%`]})]})'
          new = '(0,F.jsxs)(`main`,{className:`boot-screen giralab-loading-screen`,"aria-label":`GiraLab 로딩 중`,children:[(0,F.jsx)(`img`,{className:`boot-loading-art`,src:mc(`giralab-loading-art.webp`),alt:``,fetchPriority:`high`,draggable:!1}),(0,F.jsxs)(`div`,{className:`boot-bottom`,children:[(0,F.jsx)(`div`,{className:`boot-progress-track`,role:`progressbar`,"aria-label":`게임 준비 진행`,"aria-valuemin":0,"aria-valuemax":100,"aria-valuenow":_e,children:(0,F.jsx)(`span`,{style:{width:`${Math.max(0,Math.min(100,_e))}%`}})}),(0,F.jsx)(`p`,{children:_e===100?`준비 완료`:`로딩 중...`})]})]})'
          if js.count(old) != 1:
              raise SystemExit(f"expected exactly one compiled loading branch, got {js.count(old)}")
          js = js.replace(old, new, 1)
          js_file.write_text(js)
          print(js_file)
          PY

          CSS_FILE="$(find site/assets -maxdepth 1 -type f -name '*.css' | head -n1)"
          cat >> "$CSS_FILE" <<'CSS'

          /* GiraLab loading v4: supplied artwork + real React loading progress. */
          .boot-screen.giralab-loading-screen{
            padding:0!important;
            display:block!important;
            background:#000b1b!important;
            overflow:hidden!important;
          }
          .giralab-loading-screen .boot-loading-art{
            position:absolute!important;
            left:50%!important;
            top:0!important;
            transform:translateX(-50%)!important;
            display:block!important;
            width:100%!important;
            height:auto!important;
            max-height:calc(100dvh - 145px)!important;
            object-fit:contain!important;
            object-position:top center!important;
            image-rendering:auto!important;
            user-select:none;
            -webkit-user-drag:none;
          }
          .giralab-loading-screen .boot-bottom{
            position:absolute!important;
            left:50%!important;
            bottom:max(5.5dvh,28px)!important;
            transform:translateX(-50%)!important;
            width:min(74vw,390px)!important;
            text-align:center!important;
          }
          .giralab-loading-screen .boot-progress-track{
            height:16px!important;
            padding:2px!important;
            border:2px solid #107aff!important;
            border-radius:999px!important;
            background:#06142b!important;
            box-shadow:0 0 13px rgba(0,136,255,.6),inset 0 0 8px rgba(0,0,0,.6)!important;
            overflow:hidden!important;
            box-sizing:border-box!important;
          }
          .giralab-loading-screen .boot-progress-track>span{
            display:block!important;
            height:100%!important;
            border-radius:999px!important;
            background:linear-gradient(90deg,#20e8ff,#15bfff 55%,#4df5ff)!important;
            box-shadow:0 0 13px rgba(24,228,255,.9)!important;
            transition:width .22s ease!important;
          }
          .giralab-loading-screen .boot-bottom p{
            margin:17px 0 0!important;
            color:#b9d9ff!important;
            font-size:clamp(14px,4vw,18px)!important;
            font-weight:800!important;
            letter-spacing:.2px!important;
            text-shadow:0 0 10px rgba(49,155,255,.6)!important;
          }
          @media(max-height:700px){
            .giralab-loading-screen .boot-loading-art{max-height:calc(100dvh - 125px)!important}
            .giralab-loading-screen .boot-bottom{bottom:max(3dvh,18px)!important}
          }
          CSS

          JS_FILE="$(find site/assets -maxdepth 1 -type f -name '*.js' | head -n1)"
          node --check "$JS_FILE"
          grep -q 'giralab-loading-art.webp' "$JS_FILE"
          grep -q 'boot-progress-track' "$JS_FILE"
          test -s site/giralab-loading-art.webp

      - name: Verify loading screen visually
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site >/tmp/giralab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 20s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=650 --screenshot=loading-proof.png http://127.0.0.1:4173/ >/tmp/browser.log 2>&1 || true
          test -s loading-proof.png

      - name: Upload loading proof
        uses: actions/upload-artifact@v4
        with:
          name: loading-screen-proof
          path: loading-proof.png
          retention-days: 2

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
