name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'site/**'
      - 'scripts/verify-live-loading.py'
      - 'scripts/verify-combo-browser.py'
      - 'scripts/verify-recipe-tiers.py'
      - 'scripts/verify-rules-guide.py'
      - 'scripts/apply-rules-guide.py'
      - 'deploy-assets/rules-guide-web.delta.b64'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore the checksum-verified rules guide build
        if: hashFiles('deploy-assets/rules-guide-web.delta.b64') != ''
        run: |
          python3 -m pip install --disable-pip-version-check bsdiff4==1.2.6
          python3 scripts/apply-rules-guide.py
      - name: Validate the durable build and bind regression tests to its revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          assert Path('site/index.html').is_file()
          art=Path('site/giralab-loading-approved-aecda336.jpg').read_bytes()
          assert len(art)==195444
          assert hashlib.sha256(art).hexdigest()=='aecda336dbd02b209b88e906e731e50f78bd882a45a04ea56193b10755501cc4'
          assert not Path('site/loading-fix.js').exists() and not Path('site/loading-fix.css').exists()
          Path('site/.nojekyll').touch()
          meta=json.loads(Path('site/source-build.json').read_text())
          assert meta['game_version']=='1.5.3' and meta['recipe_tier_badges'] is True
          assert meta['automatic_board_hints'] is False and meta['rules_version']==2
          assert meta['board_validity_max_tier']=='advanced' and meta['rules_guide'] is True
          assert meta['tier_palette_version']==2
          revision=meta['source_commit']
          verifier=Path('scripts/verify-live-loading.py')
          source=re.sub(r"^COMMIT = '[0-9a-f]+'$",'COMMIT = '+repr(revision),verifier.read_text(),flags=re.M)
          verifier.write_text(source)
          verifier=Path('scripts/verify-combo-browser.py')
          source=re.sub(r"^EXPECTED='[0-9a-f]+'$",'EXPECTED='+repr(revision),verifier.read_text(),flags=re.M)
          source=re.sub(r'GiraLab · [0-9]+\.[0-9]+\.[0-9]+','GiraLab · '+meta['game_version'],source)
          anchor="    assert now['combo']==step+1,now"
          addition="    assert any(find(now['board'],seq) for _,seq,_ in RECIPES if len(seq)<6), 'Normal/advanced safety path missing after refill'"
          if addition not in source:
              assert source.count(anchor)==1
              source=source.replace(anchor,anchor+'\n'+addition)
          verifier.write_text(source)
          verifier=Path('scripts/verify-recipe-tiers.py')
          verifier.write_text(verifier.read_text().replace('1.5.2',meta['game_version']))
          PY
          for file in site/assets/*.js; do node --check "$file"; done
      - name: Install browser verifier and Korean fonts
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify the candidate before publishing
        run: |
          python3 scripts/verify-live-loading.py --site site --out predeploy-proof
          python3 scripts/verify-combo-browser.py --site site --out predeploy-combo-proof
          python3 scripts/verify-recipe-tiers.py --site site --out predeploy-recipe-tier-proof
          python3 scripts/verify-rules-guide.py --site site --out predeploy-rules-guide-proof
      - name: Persist the exact verified static build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git add scripts/verify-live-loading.py scripts/verify-combo-browser.py scripts/verify-recipe-tiers.py
          git rm --ignore-unmatch deploy-assets/rules-guide-web.delta.b64
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: persist verified rules guide and board safety v1.5.3 [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual live website
        run: |
          sleep 5
          python3 scripts/verify-live-loading.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-loading-proof
          python3 scripts/verify-combo-browser.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-combo-proof
          python3 scripts/verify-recipe-tiers.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-recipe-tier-proof
          python3 scripts/verify-rules-guide.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-rules-guide-proof
      - name: Upload browser screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-guide-tier-colors-board-safety-verification
          path: |
            predeploy-proof
            predeploy-combo-proof
            predeploy-recipe-tier-proof
            predeploy-rules-guide-proof
            live-loading-proof
            live-combo-proof
            live-recipe-tier-proof
            live-rules-guide-proof
          if-no-files-found: warn
          retention-days: 7
