name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built web bundle
        run: |
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fe4c-8206-87aa-7f81cb265cd2/raw?se=2026-09-18T02%3A09%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=ef4359a4-31c1-5287-b744-616d17b32fcd&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T01%3A02%3A46Z&ske=2026-09-19T01%3A02%3A46Z&sks=b&skv=2026-02-06&sig=s4XJoPhViatufWuK6oZpvrJvHDb87/1uJ%2BpJbaMkUao%3D' -o giralab-web-dist.zip
          mkdir -p site
          unzip -q giralab-web-dist.zip -d site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
