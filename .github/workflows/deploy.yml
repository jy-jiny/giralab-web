name: Deploy GiraLab Web
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'site/**'
      - 'scripts/verify-*.py'
      - 'scripts/restore-dark-lobby.py'
      - 'release-tools/verify-audio-mythic.py'
      - 'release-tools/dark-lobby-public.part*'
      - 'deploy-assets/dark-lobby*'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged storage compatibility
        run: |
          python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://tqqgnrfklhmxwsphjera.supabase.co/functions/v1/giralab-game/api/health',headers={'Origin':'https://jy-jiny.github.io'})
          with urllib.request.urlopen(req,timeout=30) as response:health=json.load(response)
          assert health.get('ok') and health.get('recipeCount')==19 and health.get('rulesVersion')==3,health
          print('Existing storage server compatible:',health)
          PY
      - name: Restore exact tested dark lobby and regression verifiers
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check bsdiff4==1.2.6 playwright==1.55.0
          python3 scripts/restore-dark-lobby.py
          for f in site/assets/*.js; do node --check "$f"; done
          python3 -m py_compile scripts/verify-*.py release-tools/verify-audio-mythic.py
      - name: Install Korean fonts for mobile screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify dark carousel, theme codex and preserved game before publication
        run: |
          set -euo pipefail
          python3 release-tools/verify-lobby-cleanup.py --site site --out predeploy-dark-lobby
          python3 scripts/verify-theme-book.py --site site --out predeploy-theme-book
          python3 scripts/verify-theme-lobby.py --site site --out predeploy-theme-lobby
          python3 scripts/verify-game-music.py --site site --out predeploy-game-music
          python3 scripts/verify-burst-refill.py --site site --out predeploy-burst-refill
          python3 scripts/verify-loading-audio.py --site site --out predeploy-loading-audio
          python3 release-tools/verify-audio-mythic.py --site site --out predeploy-audio-mythic
          python3 scripts/verify-combo-browser.py --site site --out predeploy-combo
          python3 scripts/verify-codex-order.py --site site --out predeploy-codex
          python3 scripts/verify-live-loading.py --site site --out predeploy-loading
      - name: Persist verified files and remove completed transfer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git add scripts/verify-*.py release-tools/verify-audio-mythic.py
          git rm --ignore-unmatch deploy-assets/dark-lobby.json deploy-assets/dark-lobby.delta.b64 deploy-assets/dark-lobby-import.json
          rm -f deploy-assets/dark-lobby.json deploy-assets/dark-lobby.delta.b64
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: verified original-dark horizontal theme lobby, preserved game web 1.7.2 [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Brief backoff for transient Pages error
        if: steps.publish.outcome == 'failure'
        run: sleep 10
      - name: Retry the same verified artifact
        id: retry
        if: steps.publish.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify actual live dark carousel, theme codex and preserved gameplay
        run: |
          set -euo pipefail
          sleep 5
          python3 release-tools/verify-lobby-cleanup.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-dark-lobby
          python3 scripts/verify-theme-book.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-theme-book
          python3 scripts/verify-theme-lobby.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-theme-lobby
          python3 scripts/verify-game-music.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-game-music
          python3 scripts/verify-burst-refill.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-burst-refill
          python3 scripts/verify-loading-audio.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-loading-audio
          python3 release-tools/verify-audio-mythic.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-audio-mythic
          python3 scripts/verify-combo-browser.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-combo
          python3 scripts/verify-codex-order.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-codex
          python3 scripts/verify-live-loading.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dark-lobby-1.7.2-live-verification
          path: |
            predeploy-*
            live-*
          if-no-files-found: warn
          retention-days: 7
