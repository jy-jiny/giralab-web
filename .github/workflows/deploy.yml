name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built web bundle
        run: |
          curl -fL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-83f4-81fb-bf75-78ac39c864b2/raw?se=2026-09-18T02%3A20%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=1f46d9ab-cb11-5900-842c-edef97f8c36c&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T22%3A55%3A44Z&ske=2026-09-18T22%3A55%3A44Z&sks=b&skv=2026-02-06&sig=0eoXD%2BvwovtuV4C3T1JHTc1C9I7xA0RobOD2WgjWxsU%3D' -o giralab-web-dist.zip
          mkdir -p site
          unzip -q giralab-web-dist.zip -d site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
