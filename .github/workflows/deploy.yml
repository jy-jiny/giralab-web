name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built web bundle
        run: |
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5a48-81f5-8fef-3e07853eee58/raw?se=2026-09-18T05%3A08%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=9ce87dcf-a1e0-57e0-9a6e-a588d0b62262&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T00%3A20%3A05Z&ske=2026-09-19T00%3A20%3A05Z&sks=b&skv=2026-02-06&sig=vFGYfHNXGPl1LD%2B%2B7ntbjgQaf%2BIMu4TFrSh46Va1yus%3D' -o giralab-web-dist.zip
          mkdir -p site
          unzip -q giralab-web-dist.zip -d site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
