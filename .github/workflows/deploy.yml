name: Deploy GiraLab Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'site/**'
      - 'scripts/verify-live-loading.py'
      - 'scripts/verify-combo-browser.py'
      - 'scripts/verify-recipe-tiers.py'
      - 'scripts/apply-static-update.py'
      - 'scripts/apply-no-auto-hints.py'
      - 'deploy-assets/combo-v2.delta.b64'
      - 'deploy-assets/approved-web-import.json'
      - 'deploy-assets/no-auto-hints-web.delta.b64'
      - 'deploy-assets/no-auto-hints-web.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply the checksum-verified combo build
        if: hashFiles('deploy-assets/combo-v2.delta.b64') != ''
        run: python3 scripts/apply-static-update.py
      - name: Apply the exact tested no-auto-hints build
        if: hashFiles('deploy-assets/no-auto-hints-web.delta.b64') != ''
        run: |
          python3 -m pip install --disable-pip-version-check bsdiff4==1.2.6
          python3 scripts/apply-no-auto-hints.py
      - name: Import and validate the durable site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, re, shutil, urllib.request, zipfile
          from pathlib import Path
          spec = Path('deploy-assets/approved-web-import.json')
          if spec.exists():
              data = json.loads(spec.read_text())
              with urllib.request.urlopen(data['url'], timeout=90) as response:
                  bundle = response.read()
              assert hashlib.sha256(bundle).hexdigest() == data['sha256'], 'Bundle checksum mismatch'
              destination = Path('site').resolve()
              staging = Path('site-import').resolve()
              staging.mkdir(exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
                  for name in archive.namelist():
                      assert (staging / name).resolve().is_relative_to(staging), 'Unsafe archive path'
                  archive.extractall(staging)
              meta = json.loads((staging / 'source-build.json').read_text())
              assert meta['source_commit'] == data['sourceCommit']
              assert meta['approved_image_sha256'] == data['artworkSHA256']
              art = (staging / 'giralab-loading-approved-aecda336.jpg').read_bytes()
              assert len(art) == 195444 and hashlib.sha256(art).hexdigest() == data['artworkSHA256']
              if destination.exists(): shutil.rmtree(destination)
              staging.rename(destination)
              (destination / 'loading-build.json').write_text(json.dumps({'sourceRun':data['sourceRun'],'sourceCommit':data['sourceCommit'],'bundleSHA256':data['sha256'],'artworkSHA256':data['artworkSHA256'],'dimensions':[864,1536],'imageUnchanged':True,'gameVersion':meta['game_version']},indent=2))
          assert Path('site/index.html').is_file(), 'Missing validated static build'
          art = Path('site/giralab-loading-approved-aecda336.jpg').read_bytes()
          assert len(art) == 195444
          assert hashlib.sha256(art).hexdigest() == 'aecda336dbd02b209b88e906e731e50f78bd882a45a04ea56193b10755501cc4'
          assert not Path('site/loading-fix.js').exists() and not Path('site/loading-fix.css').exists()
          Path('site/.nojekyll').touch()
          meta = json.loads(Path('site/source-build.json').read_text())
          assert meta['game_version'] == '1.5.2' and meta['recipe_tier_badges'] is True
          assert meta['automatic_board_hints'] is False and meta['rules_version'] == 2
          revision = meta['source_commit']
          verifier = Path('scripts/verify-live-loading.py')
          source = re.sub(r"^COMMIT = '[0-9a-f]+'$", 'COMMIT = ' + repr(revision), verifier.read_text(), flags=re.M)
          verifier.write_text(source)
          verifier = Path('scripts/verify-combo-browser.py')
          source = re.sub(r"^EXPECTED='[0-9a-f]+'$", 'EXPECTED=' + repr(revision), verifier.read_text(), flags=re.M)
          source = re.sub(r'GiraLab · [0-9]+\.[0-9]+\.[0-9]+', 'GiraLab · ' + meta['game_version'], source)
          source = source.replace("assert page.locator('.hinted-tile').count()>=3", "assert page.locator('.hinted-tile,.hint-order').count()==0")
          source = source.replace("f'hints-{width}x{height}.png'", "f'no-hints-{width}x{height}.png'")
          source = source.replace("assert meta['source_commit']==EXPECTED and meta['rules_version']==2,meta", "assert meta['source_commit']==EXPECTED and meta['rules_version']==2 and meta['automatic_board_hints'] is False,meta")
          assert "assert page.locator('.hinted-tile,.hint-order').count()==0" in source
          verifier.write_text(source)
          verifier = Path('scripts/verify-recipe-tiers.py')
          source = verifier.read_text().replace('1.5.1', meta['game_version'])
          verifier.write_text(source)
          PY
          for file in site/assets/*.js; do node --check "$file"; done
      - name: Install browser verifier and Korean fonts
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify no hints, scoring, codex and loading before deployment
        run: |
          python3 scripts/verify-live-loading.py --site site --out predeploy-proof
          python3 scripts/verify-combo-browser.py --site site --out predeploy-combo-proof
          python3 scripts/verify-recipe-tiers.py --site site --out predeploy-recipe-tier-proof
      - name: Persist the verified static build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git add scripts/verify-live-loading.py scripts/verify-combo-browser.py scripts/verify-recipe-tiers.py
          git rm --ignore-unmatch deploy-assets/approved-web-import.json deploy-assets/combo-v2.delta.b64 deploy-assets/no-auto-hints-web.delta.b64 deploy-assets/no-auto-hints-web.json
          if ! git diff --cached --quiet; then
            git commit -m 'deploy: persist verified no-auto-hints v1.5.2 [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the actual live website
        run: |
          sleep 5
          python3 scripts/verify-live-loading.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-loading-proof
          python3 scripts/verify-combo-browser.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-combo-proof
          python3 scripts/verify-recipe-tiers.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-recipe-tier-proof
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-auto-hints-combo-codex-loading-verification
          path: |
            predeploy-proof
            predeploy-combo-proof
            predeploy-recipe-tier-proof
            live-loading-proof
            live-combo-proof
            live-recipe-tier-proof
          if-no-files-found: warn
          retention-days: 7
