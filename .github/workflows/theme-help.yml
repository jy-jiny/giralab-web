name: Publish scoped options and themed help
on:
  push:
    branches: [main]
    paths: ['deploy-assets/theme-help-release.b64']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install verification and delta tools
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.55.0 bsdiff4==1.2.6
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Restore exact source-tested settings/help delta, preserving all other assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,zlib,bsdiff4
          from pathlib import Path
          digest=lambda b:hashlib.sha256(b).hexdigest()
          manifest=json.loads(Path('deploy-assets/theme-help-release.json').read_text())
          encoded=''.join(Path('deploy-assets/theme-help-release.b64').read_text().split())
          assert digest(encoded.encode())==manifest['encoded_sha256'],'Transfer checksum mismatch'
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert digest(raw)==manifest['payload_sha256'],'Payload checksum mismatch'
          plan=json.loads(raw);root=Path('site')
          assert plan['source_commit']==manifest['source_commit']
          meta=json.loads((root/'source-build.json').read_text())
          assert meta['source_commit']==plan['base_source_commit'],'Live source baseline changed; review before release'
          prepared={}
          for entry in plan['files']:
              path=Path(entry['path']);oldpath=Path(entry['old_path'])
              for candidate in [path,oldpath]:assert not candidate.is_absolute() and '..' not in candidate.parts
              assert str(path) in ['index.html','source-build.json'] or (path.parts[0]=='assets' and path.suffix in ['.js','.css'])
              old=(root/oldpath).read_bytes()
              assert digest(old)==entry['old_sha256'],str(oldpath)
              new=bsdiff4.patch(old,base64.b64decode(entry['delta_b64'],validate=True))
              assert digest(new)==entry['new_sha256'],str(path)
              prepared[str(path)]=new
          assert set(prepared)==set(manifest['changed_files'])
          untouched={p.relative_to(root).as_posix():digest(p.read_bytes()) for p in root.rglob('*') if p.is_file() and p.relative_to(root).as_posix() not in prepared and p.relative_to(root).as_posix() not in plan['delete_assets']}
          for path,data in prepared.items():(root/path).write_bytes(data)
          for path in plan['delete_assets']:
              p=Path(path)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='assets' and p.suffix in ['.js','.css'] and path not in prepared
              (root/p).unlink()
          for path,sha in untouched.items():assert digest((root/path).read_bytes())==sha,path
          meta=json.loads((root/'source-build.json').read_text())
          assert meta['settings_new_game'] is False and meta['theme_help_ids']==['burger','music','war','robot']
          assert meta['viewport_fit']=='main-and-game-only' and meta['dialog_scroll_preserved']
          Path('release-plan.json').write_text(json.dumps(plan,ensure_ascii=False))
          Path('unchanged-assets.json').write_text(json.dumps(untouched))
          print('Verified source:',manifest['source_commit'],'; unchanged assets:',len(untouched))
          PY
          for f in site/assets/*.js; do node --check "$f"; done
          python3 -m py_compile release-tools/verify-theme-help.py
      - name: Verify candidate settings/help and original theme codex before publication
        run: |
          set -euo pipefail
          python3 release-tools/verify-theme-help.py --site site --out predeploy-theme-help
          python3 scripts/verify-theme-book.py --site site --out predeploy-theme-book
      - name: Persist the verified web build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git commit -m 'fix: publish options restart removal and four-theme help; preserve game and visuals [skip ci]'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Backoff for transient Pages error
        if: steps.publish.outcome == 'failure'
        run: sleep 10
      - name: Retry the same verified artifact
        id: retry
        if: steps.publish.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Confirm actual live source and exact assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          plan=json.loads(Path('release-plan.json').read_text());base='https://jy-jiny.github.io/giralab-web/'
          def get(path):
              req=urllib.request.Request(base+path+'?themehelp='+plan['source_commit'],headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          for attempt in range(18):
              try:
                  meta=json.loads(get('source-build.json'))
                  if meta['source_commit']==plan['source_commit']:break
              except Exception as e:print(type(e).__name__)
              time.sleep(5)
          else:raise AssertionError('Expected source has not reached the live site')
          hashes={entry['path']:entry['new_sha256'] for entry in plan['files']}
          hashes.update({'giralab-loading-approved-aecda336.jpg':meta['approved_image_sha256'],'audio/kitchen-rush.ogg':meta['game_music_sha256']})
          for path,sha in hashes.items():assert hashlib.sha256(get(path)).hexdigest()==sha,path
          Path('live-theme-help-assets.json').write_text(json.dumps({'source_commit':plan['source_commit'],'live_hashes':hashes,'untargeted_assets_preserved':True},indent=2))
          PY
      - name: Verify actual live settings, theme help, scrolling, and game continuation
        run: |
          set -euo pipefail
          python3 release-tools/verify-theme-help.py --url 'https://jy-jiny.github.io/giralab-web/' --out live-theme-help
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          assets=json.loads(Path('live-theme-help-assets.json').read_text())
          browser=json.loads(Path('live-theme-help/verification.json').read_text())
          assert len(browser['tests'])==6
          proof={'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source_commit':assets['source_commit'],'settings_new_game_removed':True,'help_themes':['burger','music','war','robot'],'existing_burger_help_unchanged':True,'upcoming_themes_labeled':True,'main_game_fit_preserved':True,'dialog_scrolling_preserved':True,'art_audio_game_rules_and_storage_unchanged':True,'live_assets':assets,'live_browser':browser}
          Path('deploy-assets/theme-help-live-verification.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          PY
          git add deploy-assets/theme-help-live-verification.json
          git commit -m 'test: record actual live options/help verification at six viewport sizes [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-help-live-verification
          path: |
            predeploy-theme-help
            predeploy-theme-book
            live-theme-help
            live-theme-help-assets.json
            deploy-assets/theme-help-live-verification.json
          if-no-files-found: warn
          retention-days: 7
