name: Prepare original Lunch Rush soundtrack
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-lunch-rush.yml','scripts/render-lunch-rush.py']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render original score and check audio
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 scipy==1.14.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python scripts/render-lunch-rush.py --out release-assets
          ffmpeg -v error -i release-assets/lunch-rush-v1.ogg -f null -
          ffprobe -v error -show_entries format=duration:stream=sample_rate,channels -of json release-assets/lunch-rush-v1.ogg
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('release-assets/lunch-rush-v1.json').read_text())
          assert m['bpm']==156 and m['bars']==32 and 49.2<m['duration_seconds']<49.3
          assert m['channels']==2 and m['loop_boundary_jump']<.015
          PY
      - name: Store staged audio and render specification only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-assets/lunch-rush-v1.ogg release-assets/lunch-rush-v1.json
          git commit -m 'audio: stage validated 156 BPM Lunch Rush instrumental [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: lunch-rush-original-audio
          path: release-assets/lunch-rush-v1.*
          retention-days: 7
