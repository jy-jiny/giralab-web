<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>11종 캐릭터 보행 · PROJECT BITE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17231f;color:#fff2d7;font:16px/1.55 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:20px 16px 32px}h1{font-size:25px;line-height:1.25;margin:8px 0}p{color:#bbcbbf;margin:8px 0 16px}.brand{font-size:12px;letter-spacing:.13em;color:#e7c97c}.select{display:flex;align-items:center;gap:12px;margin:16px 0}select{min-width:0;flex:1;min-height:48px;padding:10px 12px;font:inherit;color:#fff2d7;background:#2c4136;border:1px solid #7a8c70;border-radius:12px}video{display:block;width:100%;height:auto;border-radius:20px;background:#0d1310}a{color:#f2d17e}footer{font-size:13px;color:#9caf9f;margin-top:16px}.download{display:inline-block;padding:12px 0}.status{min-height:24px;font-size:14px}button{min-height:44px;padding:10px 16px;border:0;border-radius:12px;font:inherit;background:#f2d17e;color:#19231c}</style></head><body><main>
<span class="brand">PROJECT BITE</span><h1>11종 캐릭터 보행</h1><p>캐릭터를 고르고 재생 버튼을 눌러 보세요.</p>
<div class="select"><label for="pet">캐릭터</label><select id="pet"></select></div>
<video id="video" controls muted playsinline loop preload="metadata" poster="calm.jpg"><source src="calm.mp4" type="video/mp4"></video>
<div class="status" id="status" role="status"></div><button id="play" type="button">▶ 영상 재생</button> <a class="download" id="direct" href="calm.mp4" target="_blank" rel="noopener">영상만 열기</a>
<footer>실제 게임 화면 녹화 · 24fps · 캐릭터별 두 번 왕복<br>2026.10.13 개발 적용본 확인용입니다. 새 APK 배포와는 별도입니다.</footer>
</main><script>
const pets=[['calm','침착이'],['cool','냉각이'],['focus','집중이'],['starter','준비왕'],['basic','기본기'],['gambler','승부사'],['organizer','정리왕'],['frost','빙결사'],['chain','연쇄장인'],['guardian','위기관리자'],['phoenix','불사조']];
const select=document.querySelector('#pet'),video=document.querySelector('#video'),status=document.querySelector('#status'),direct=document.querySelector('#direct');
pets.forEach(([id,name])=>{const option=document.createElement('option');option.value=id;option.textContent=name;select.append(option)});
function play(){video.play().catch(()=>{status.textContent='아래 재생 버튼을 눌러 주세요.'})}
select.addEventListener('change',()=>{const id=select.value;video.pause();video.poster=id+'.jpg';video.src=id+'.mp4';direct.href=id+'.mp4';status.textContent='영상을 불러오는 중입니다…';video.load();play()});
document.querySelector('#play').addEventListener('click',play);
video.addEventListener('playing',()=>{status.textContent=select.selectedOptions[0].textContent+' · 재생 중'});
video.addEventListener('error',()=>{status.textContent='재생이 안 되면 “영상만 열기”를 눌러 주세요.'});
document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause()});
</script></body></html>
